<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สมุดเดินทาง — Trip Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Noto+Serif+Thai:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F6F1FA;
    --paper-raised: #FCFAFE;
    --ink: #362D4C;
    --ink-soft: #675D80;
    --line: #E5DBF0;
    --line-soft: #EFE7F7;
    --coral: #F3B9C7;
    --coral-dark: #963C58;
    --teal: #AEE1D6;
    --teal-dark: #337367;
    --plum: #665A94;
    --plum-dark: #4E4472;
    --gold: #B4863A;
    --danger: #B84F4F;
    --radius: 14px;
    --shadow: 0 1px 0 rgba(54,45,76,0.06);
  }
  *{box-sizing:border-box;}
  @keyframes fadeSlideUp{
    from{ opacity: 0; transform: translateY(14px); }
    to{ opacity: 1; transform: translateY(0); }
  }
  @keyframes shimmerGradient{
    0%{ background-position: 0% 50%; }
    50%{ background-position: 100% 50%; }
    100%{ background-position: 0% 50%; }
  }
  @keyframes floatDrift{
    0%, 100%{ transform: translateY(0) rotate(0deg); }
    50%{ transform: translateY(-8px) rotate(1.5deg); }
  }
  @keyframes softPulse{
    0%, 100%{ opacity: 0.55; }
    50%{ opacity: 1; }
  }
  @keyframes viewFadeIn{
    from{ opacity: 0; transform: translateY(8px); }
    to{ opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{ animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }
  html,body{margin:0;padding:0;}
  body{
    background: var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(75,68,96,0.05) 1px, transparent 0);
    background-size: 22px 22px;
    color: var(--ink);
    font-family: 'Noto Sans Thai', -apple-system, sans-serif;
    min-height: 100vh;
  }
  h1,h2,h3{ font-family: 'Noto Serif Thai', serif; font-weight: 700; margin: 0; }
  .eyebrow{
    font-family: 'IBM Plex Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-size: 11px;
    color: var(--ink-soft);
  }
  button{ font-family: inherit; cursor: pointer; }
  input, select, textarea{
    font-family: 'Noto Sans Thai', sans-serif;
    font-size: 15px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    color: var(--ink);
    width: 100%;
  }
  input:focus, select:focus, textarea:focus, button:focus-visible{
    outline: 2px solid var(--coral);
    outline-offset: 1px;
  }
  .btn{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 18px;
    border-radius: 999px;
    border: 1px solid var(--ink);
    background: transparent;
    color: var(--ink);
    font-weight: 600;
    font-size: 14px;
    transition: transform 0.2s cubic-bezier(.2,.9,.25,1.4), background 0.15s ease, box-shadow 0.2s ease;
  }
  .btn:hover{ background: rgba(75,68,96,0.06); transform: translateY(-2px); }
  .btn:active{ transform: scale(0.95) translateY(0); }
  .btn-primary{
    background: var(--coral-dark);
    border-color: var(--coral-dark);
    color: #fff;
    box-shadow: 0 2px 10px -4px rgba(150,57,90,0.5);
  }
  .btn-primary:hover{ background: #96395A; border-color: #96395A; box-shadow: 0 8px 18px -6px rgba(150,57,90,0.65); transform: translateY(-2px); }
  .btn-ghost{
    border-color: transparent;
    color: var(--ink-soft);
  }
  .btn-ghost:hover{ background: rgba(75,68,96,0.06); color: var(--ink); }
  .btn-danger{ border-color: var(--danger); color: var(--danger); }
  .btn-danger:hover{ background: rgba(201,120,120,0.1); }
  .btn:disabled{ opacity: 0.45; cursor: not-allowed; }
  .btn:disabled:hover{ background: transparent; }

  #app{ max-width: 860px; margin: 0 auto; padding: 32px 20px 80px; }
  .hide{ display: none !important; }
  #dashboard-view:not(.hide), #detail-view:not(.hide), #achievement-view:not(.hide){
    animation: viewFadeIn 0.35s cubic-bezier(.2,.8,.3,1) both;
  }

  /* ---------- login ---------- */
  #login-view{
    min-height: calc(100vh - 64px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .passport{
    width: 100%;
    max-width: 380px;
    background: linear-gradient(120deg, var(--plum), var(--plum-dark), var(--plum));
    background-size: 220% 220%;
    animation: fadeSlideUp 0.5s cubic-bezier(.2,.8,.3,1) both, shimmerGradient 14s ease infinite;
    color: #FAF6FF;
    border-radius: 18px;
    padding: 40px 32px;
    box-shadow: 0 18px 40px -20px rgba(78,68,114,0.55);
    position: relative;
    overflow: hidden;
  }
  .passport::before{
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px solid rgba(250,246,255,0.28);
    border-radius: 10px;
    pointer-events: none;
  }
  .passport-art{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    animation: floatDrift 9s ease-in-out infinite;
  }
  .passport > *:not(.passport-art){ position: relative; z-index: 1; }
  .passport .mark{
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 13px;
    letter-spacing: 0.08em;
    color: rgba(250,246,255,0.7);
    margin-bottom: 4px;
  }
  .passport h1{
    font-size: 28px;
    color: #FAF6FF;
    margin-bottom: 6px;
  }
  .passport p.sub{
    font-size: 13.5px;
    color: rgba(250,246,255,0.78);
    margin: 0 0 28px;
    line-height: 1.6;
  }
  .passport label{
    display:block;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-family: 'IBM Plex Mono', monospace;
    color: rgba(250,246,255,0.65);
    margin-bottom: 6px;
  }
  .passport input{
    background: rgba(250,246,255,0.12);
    border: 1px solid rgba(250,246,255,0.32);
    color: #FAF6FF;
    margin-bottom: 16px;
  }
  .passport input::placeholder{ color: rgba(250,246,255,0.45); }
  .passport .btn-primary{ width: 100%; padding: 12px; font-size: 15px; }
  .remember-box{
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px dashed rgba(250,246,255,0.28);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13.5px;
  }
  .login-error{
    color: #FFC9DA;
    font-size: 13px;
    margin: -10px 0 14px;
    min-height: 16px;
  }

  /* ---------- header / tabs ---------- */
  header.top{
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
    gap: 12px;
    flex-wrap: wrap;
  }
  header.top .who{ display:flex; align-items:center; gap:10px; }
  .avatar-stamp{
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 1.5px dashed var(--coral-dark);
    display: flex; align-items:center; justify-content:center;
    font-family: 'Noto Serif Thai', serif;
    font-weight: 700;
    color: var(--coral-dark);
    background: rgba(201,107,135,0.1);
    flex-shrink: 0;
  }
  .tabs{
    display: flex;
    gap: 4px;
    background: rgba(75,68,96,0.06);
    border: 1px solid var(--line-soft);
    padding: 4px;
    border-radius: 999px;
    width: fit-content;
    margin-bottom: 22px;
  }
  .tab-btn{
    border: none;
    background: transparent;
    padding: 9px 18px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 14px;
    color: var(--ink-soft);
    transition: background 0.25s cubic-bezier(.2,.9,.25,1), color 0.25s ease, transform 0.15s ease;
  }
  .tab-btn.active{ background: var(--ink); color: #FAF6FF; }
  .tab-btn:not(.active):hover{ color: var(--ink); transform: translateY(-1px); }

  /* ---------- trip cards ---------- */
  .trip-section-heading{
    display: flex; align-items: center; gap: 10px;
    font-size: 16px; margin: 24px 0 14px;
    position: relative; padding-bottom: 10px;
  }
  .trip-section-heading::after{
    content: ""; position: absolute; left: 0; bottom: 0;
    width: 46px; height: 3px; border-radius: 999px;
    background: linear-gradient(90deg, var(--coral-dark), var(--plum));
  }
  .trip-section-heading:first-child{ margin-top: 0; }
  .trip-section-count{
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500;
    color: var(--ink-soft); background: rgba(54,45,76,0.06);
    border-radius: 999px; padding: 2px 10px;
  }
  .trip-grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 18px;
    margin-bottom: 8px;
  }
  .trip-card{
    background: var(--paper-raised);
    border: 1px solid var(--line-soft);
    border-radius: var(--radius);
    padding: 0;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    opacity: 0;
    animation: fadeSlideUp 0.45s cubic-bezier(.2,.8,.3,1) both;
    animation-delay: var(--stagger, 0ms);
    transition: border-color 0.2s ease, transform 0.25s cubic-bezier(.2,.9,.25,1.4), box-shadow 0.25s ease;
  }
  .trip-card:hover{
    border-color: var(--coral-dark);
    transform: translateY(-5px) scale(1.015) rotate(-0.4deg);
    box-shadow: 0 16px 30px -16px rgba(54,45,76,0.42);
  }
  .trip-card:active{ transform: translateY(-2px) scale(0.99); }
  .trip-card-art{
    height: 92px;
    position: relative;
    display: flex;
    align-items: flex-end;
    padding: 10px 14px;
    overflow: hidden;
  }
  .trip-card-art svg{ position:absolute; right:-6px; bottom:-8px; width:104px; height:104px; opacity:0.9; transition: transform 0.35s cubic-bezier(.2,.9,.25,1.2); }
  .trip-card:hover .trip-card-art svg{ transform: scale(1.12) rotate(4deg); }
  .trip-card-body{ padding: 14px 18px 16px; }
  .trip-card .stamp{
    position: absolute;
    top: 12px; right: 12px;
    width: 50px; height: 50px;
    border-radius: 50%;
    border: 1.5px dashed rgba(255,255,255,0.85);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    transform: rotate(-8deg);
    font-family: 'IBM Plex Mono', monospace;
    line-height: 1.05;
    text-align: center;
  }
  .trip-card .stamp b{ font-size: 14px; }
  .trip-card .stamp span{ font-size: 7.5px; letter-spacing: 0.05em; }
  .trip-card .dest{
    display: inline-flex; align-items: center; gap: 5px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #fff;
    background: rgba(0,0,0,0.16);
    border: 1px solid rgba(255,255,255,0.25);
    padding: 4px 10px 4px 8px;
    border-radius: 999px;
    position: relative;
    z-index: 1;
  }
  .dest-pin{ width: 10px; height: 10px; flex-shrink: 0; opacity: 0.9; }
  .dest-flag{ font-size: 12px; line-height: 1; }
  .maps-link{
    display: inline-flex; align-items: center; justify-content: center;
    width: 16px; height: 16px; margin-left: 4px; flex-shrink: 0;
    color: inherit; opacity: 0.75;
    transition: opacity 0.15s ease, transform 0.15s ease;
    vertical-align: middle;
  }
  .maps-link svg{ width: 12px; height: 12px; }
  .maps-link:hover{ opacity: 1; transform: scale(1.15); }
  .maps-link-inline{ color: var(--coral-dark); opacity: 0.6; }
  .maps-link-inline:hover{ opacity: 1; }
  .trip-card h3{ font-size: 19px; margin: 8px 0; max-width: 100%; }
  .trip-card .dates{ font-size: 13px; color: var(--ink-soft); margin-bottom: 10px; }
  .trip-card .owner-tag{
    font-size: 11.5px;
    color: var(--ink-soft);
    font-family: 'IBM Plex Mono', monospace;
  }
  .empty-state{
    text-align: center;
    padding: 44px 20px 36px;
    color: var(--ink-soft);
  }
  .empty-state svg{ width: 120px; height: 84px; margin-bottom: 10px; }
  .empty-state h3{ color: var(--ink); margin-bottom: 8px; font-size: 20px; }
  .empty-state p{ margin: 0 0 20px; font-size: 14px; }
  .mini-empty{
    display: flex; align-items: center; gap: 12px;
    padding: 18px 4px; color: var(--ink-soft); font-size: 14px;
  }
  .mini-empty svg{ width: 28px; height: 28px; flex-shrink: 0; color: var(--line); }
  .fab-row{ margin-bottom: 22px; }

  .dashboard-hero{
    position: relative;
    overflow: hidden;
    border-radius: 20px;
    background: linear-gradient(115deg, var(--plum), var(--coral-dark), var(--plum-dark), var(--coral-dark));
    background-size: 300% 300%;
    animation: shimmerGradient 10s ease infinite;
    padding: 34px 30px;
    margin-bottom: 26px;
    color: #fff;
  }
  .hero-art{ position:absolute; inset:0; width:100%; height:100%; animation: floatDrift 7s ease-in-out infinite; }
  .hero-content{ position:relative; z-index:1; }
  .hero-content .mark{
    font-family:'Fraunces', serif; font-style:italic; font-size:13px;
    letter-spacing:0.08em; color: rgba(255,255,255,0.75); margin-bottom:6px;
  }
  .hero-content h1{ font-size:32px; color:#fff; margin-bottom:6px; }
  .hero-sub{ font-size:14px; color: rgba(255,255,255,0.85); margin:0 0 20px; }
  .hero-stats{ display:flex; gap:14px; flex-wrap:wrap; }
  .hero-stat{
    background: rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.26);
    border-radius:12px; padding:10px 18px; min-width:100px;
    transition: transform 0.2s cubic-bezier(.2,.9,.3,1.3), background 0.2s ease;
  }
  .hero-stat:hover{ transform: translateY(-3px) scale(1.04); background: rgba(255,255,255,0.22); }
  .hero-stat .label{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em; color: rgba(255,255,255,0.78); font-family:'IBM Plex Mono', monospace; }
  .hero-stat .value{ font-family:'Noto Serif Thai', serif; font-weight:700; font-size:21px; margin-top:2px; }
  @media (max-width: 520px){
    .dashboard-hero{ padding: 26px 20px; }
    .hero-content h1{ font-size: 26px; }
  }

  /* ---------- modal ---------- */
  .modal-backdrop{
    position: fixed; inset: 0;
    background: rgba(75,68,96,0.4);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    z-index: 50;
  }
  .pac-container{
    font-family: 'Noto Sans Thai', sans-serif;
    border-radius: 10px;
    margin-top: 4px;
    border: 1px solid var(--line);
    z-index: 9999;
  }
  .pac-item{ font-size: 13.5px; padding: 8px 10px; }
  .place-picker-slot{ margin-top: 6px; }
  .place-picker-slot gmp-place-autocomplete{ width: 100%; display: block; }
  .modal{
    background: var(--paper-raised);
    border-radius: 18px;
    padding: 28px;
    width: 100%;
    max-width: 440px;
    max-height: 88vh;
    overflow-y: auto;
  }
  .modal h2{ font-size: 21px; margin-bottom: 18px; }
  .field{ margin-bottom: 14px; }
  .field label{
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .field-error{ color: var(--danger); font-size: 12.5px; margin-top: 4px; }
  .input-icon-wrap{ position: relative; }
  .input-icon-wrap .input-icon{
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    width: 17px; height: 17px; color: var(--coral-dark); pointer-events: none;
  }
  .input-icon-wrap input{ padding-left: 36px; }
  .radio-row{ display: flex; gap: 10px; }
  .radio-card{
    flex: 1;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    display: flex; align-items: center; gap: 8px;
    font-size: 13.5px;
    cursor: pointer;
  }
  .radio-card.selected{ border-color: var(--coral-dark); background: rgba(201,107,135,0.08); }
  .row2{ display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal-actions{ display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

  .popup-backdrop{ animation: viewFadeIn 0.2s ease both; }
  .popup-modal{
    text-align: center;
    animation: fadeSlideUp 0.3s cubic-bezier(.2,.8,.3,1.2) both;
  }
  .popup-icon{
    width: 52px; height: 52px; margin: 0 auto 16px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(51,115,103,0.12); color: var(--teal-dark);
  }
  .popup-icon svg{ width: 26px; height: 26px; }
  .popup-danger .popup-icon{ background: rgba(184,79,79,0.12); color: var(--danger); }
  .popup-message{ font-size: 15px; line-height: 1.6; color: var(--ink); margin: 0; }

  /* ---------- trip detail ---------- */
  .detail-header{ margin-bottom: 18px; }
  .back-link{
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--ink-soft); font-size: 13.5px; margin-bottom: 14px;
    border: none; background: none; padding: 0; font-weight: 600;
  }
  .back-link:hover{ color: var(--ink); }
  .detail-header .dest{ font-family:'IBM Plex Mono', monospace; font-size:12px; text-transform:uppercase; letter-spacing:0.08em; color:var(--coral-dark); }
  .detail-header h1{ font-size: 30px; margin: 6px 0 6px; }
  .detail-header .meta-row{ display:flex; gap:14px; flex-wrap:wrap; align-items:center; color: var(--ink-soft); font-size: 13.5px; }

  .detail-hero{
    position: relative; overflow: hidden; border-radius: 20px;
    padding: 30px 28px; margin-bottom: 8px;
    background-size: 220% 220%;
    animation: fadeSlideUp 0.5s ease both, shimmerGradient 12s ease infinite;
  }
  .detail-hero-art{ position:absolute; right:-24px; bottom:-24px; width:220px; height:220px; animation: floatDrift 8s ease-in-out infinite; }
  .detail-hero-art svg{ width:100%; height:100%; }
  .detail-hero-stamp{
    position:absolute; top:20px; right:22px;
    width:56px; height:56px; border-radius:50%;
    border:1.5px dashed rgba(255,255,255,0.7); color:#fff;
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    transform: rotate(-8deg); font-family:'IBM Plex Mono', monospace; text-align:center; line-height:1.05;
    animation: floatDrift 5s ease-in-out infinite;
  }
  .detail-hero-stamp b{ font-size:16px; }
  .detail-hero-stamp span{ font-size:8px; letter-spacing:0.05em; }
  .detail-hero-content{ position:relative; z-index:1; max-width:78%; }
  .detail-hero-content .dest{
    display: inline-flex; align-items: center; gap: 5px;
    font-family:'IBM Plex Mono', monospace; font-size:11.5px; text-transform:uppercase;
    letter-spacing:0.06em; color:#fff;
    background: rgba(0,0,0,0.16); border: 1px solid rgba(255,255,255,0.28);
    padding: 5px 12px 5px 9px; border-radius: 999px;
  }
  .detail-hero-content .dest .dest-pin{ width: 11px; height: 11px; }
  .detail-hero-content .dest .dest-flag{ font-size: 13px; }
  .detail-hero-content h1{ font-size:28px; margin:10px 0 8px; color:#fff; }
  .detail-hero-content .meta-row{ display:flex; gap:12px; flex-wrap:wrap; align-items:center; font-size:13px; color:rgba(255,255,255,0.9); }

  .visibility-pill{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 3px 10px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.55);
    color: #fff;
  }

  .participant-row{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top: 14px; }
  .participant-chip{
    font-size: 12.5px; font-weight: 600; color: #fff;
    background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.32);
    padding: 4px 12px; border-radius: 999px;
  }

  .subtabs{ display:flex; gap: 4px; margin: 22px 0 0; flex-wrap: wrap; position: relative; z-index: 1; }
  .subtab-btn{
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(54,45,76,0.045); border: 1px solid var(--line-soft); border-bottom: none;
    padding: 10px 16px;
    font-size: 14.5px; font-weight: 600; color: var(--ink-soft);
    border-radius: 10px 10px 0 0; margin-right: 0; margin-bottom: -1px;
    transition: color 0.2s ease, background 0.2s ease;
  }
  .subtab-btn:hover{ background: rgba(54,45,76,0.09); }
  .subtab-btn svg{ width: 15px; height: 15px; flex-shrink: 0; transition: transform 0.2s ease; }
  .subtab-btn:hover svg{ transform: scale(1.15); }
  .subtab-btn.active{ color: var(--ink); background: var(--paper-raised); border-color: var(--line-soft); }
  .subtab-panel{

    if(!d) return '';

      var parts = d.split('-');

      return dt.toLocaleDateString('th-TH', { day:'numeric', month:'short', year:'numeric' });
    }catch(e){ return d; }
  }

  function dayCount(start, end){
    if(!start || !end) return null;
    var a = new Date(start), b = new Date(end);
    var diff = Math.round((b-a)/86400000);
    return diff >= 0 ? diff + 1 : null;

    var h = 0;
    s = String(s || '');
    for(var i = 0; i < s.length; i++){
      h = (h * 31 + s.charCodeAt(i)) | 0;
    }
    return Math.abs(h);
  }

  function pickPalette(trip){

  function pickIconName(trip){
    var text = ((trip.destination || '') + ' ' + (trip.title || '')).toLowerCase();
    function has(list){
      return list.some(function(k){ return text.indexOf(k) !== -1; });

  var COUNTRY_FLAGS = [

  function loadMapsApi(){
    if(!MAPS_API_KEY) return Promise.reject(new Error('no api key'));
    if(mapsLoadPromise) return mapsLoadPromise;
    mapsLoadPromise = new Promise(function(resolve, reject){
      function waitForImportLibrary(attemptsLeft){
        if(window.google && window.google.maps && typeof google.maps.importLibrary === 'function'){
          resolve();
          return;
        }
        if(attemptsLeft <= 0){
          reject(new Error('google.maps.importLibrary not ready in time'));
          return;
        }
        setTimeout(function(){ waitForImportLibrary(attemptsLeft - 1); }, 100);
      }
      if(window.google && window.google.maps && typeof google.maps.importLibrary === 'function'){
        resolve();
        return;
      }
      var script = document.createElement('script');
      script.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(MAPS_API_KEY) + '&libraries=places&language=th&region=TH&loading=async';
      script.async = true;
      script.onload = function(){ waitForImportLibrary(50); };
      script.onerror = function(){ reject(new Error('maps load failed')); };
      document.head.appendChild(script);
    });
    return mapsLoadPromise;
  }

  function distanceMatrixOnce(service, origin, destination, mode){
    return new Promise(function(resolve){
      service.getDistanceMatrix({
        origins: [origin],
        destinations: [destination],
        travelMode: mode
      }, function(res, status){
        if(status === 'OK' && res.rows[0] && res.rows[0].elements[0] && res.rows[0].elements[0].status === 'OK'){
          resolve(res.rows[0].elements[0]);
        } else {
          resolve(null);
        }
      });
    });
  }

  function getLegDistance(origin, destination){
    var key = origin + '|' + destination;
    if(legCache[key]) return Promise.resolve(legCache[key]);
    if(!MAPS_API_KEY) return Promise.resolve(null);
    return loadMapsApi().then(function(){
      var service = new google.maps.DistanceMatrixService();
      return Promise.all([
        distanceMatrixOnce(service, origin, destination, google.maps.TravelMode.WALKING),
        distanceMatrixOnce(service, origin, destination, google.maps.TravelMode.DRIVING)
      ]).then(function(results){
        var out = { walk: results[0], drive: results[1] };
        legCache[key] = out;
        return out;
      });
    }).catch(function(){ return null; });
  }

  /* ---------------- trip detail ---------------- */

  function findTrip(id){
    for(var i=0;i<state.trips.length;i++){
      if(state.trips[i].id === id) return state.trips[i];
    }
    return null;
  }

  function openTripDetail(id){
    state.currentTripId = id;
    var trip = findTrip(id);
    if(!trip) return renderDashboard();
    if(trip.days.length === 0){
      trip.days.push({ id: uid('day'), label: 'วันที่ 1', stops: [] });
    }
    if(!trip.participants) trip.participants = trip.owner ? [trip.owner] : [];
    if(!trip.debts) trip.debts = [];
    state.currentDayId = trip.days[0].id;
    state.subtab = 'itinerary';
    document.getElementById('dashboard-view').classList.add('hide');
    document.getElementById('achievement-view').classList.add('hide');
    document.getElementById('detail-view').classList.remove('hide');
    renderTripDetail();
  }

  function backToDashboard(){
    state.currentTripId = null;
    renderDashboard();
  }

    var trip = findTrip(state.currentTripId);

    var isParticipant = (trip.participants || []).indexOf(state.user) !== -1;

        '<button class="subtab-btn" data-sub="checklist"><svg viewBox="0 0 20 20"><path d="M4 10l4 4 8-9" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>เช็คลิสต์</button>' +

          apiDeleteTrip(trip.id).then(function(){
            state.trips = state.trips.filter(function(t){ return t.id !== trip.id; });
            backToDashboard();
          });
        });
      });
    }

    if(state.subtab === 'itinerary') renderItinerary(trip);
    else if(state.subtab === 'budget') renderBudget(trip);
    else if(state.subtab === 'debts') renderDebts(trip);
    else renderChecklist(trip);

  /* ----- itinerary ----- */

  function renderItinerary(trip){
    var content = document.getElementById('subtab-content');
    if(!trip.days.find(function(d){ return d.id === state.currentDayId; })){
      state.currentDayId = trip.days[0] ? trip.days[0].id : null;
    }
    var day = trip.days.find(function(d){ return d.id === state.currentDayId; });

    var tabsHtml = trip.days.map(function(d){
      return '<button class="day-tab' + (d.id === state.currentDayId ? ' active' : '') + '" data-day="' + d.id + '">' + escapeHtml(d.label) + '</button>';
    }).join('') + '<button class="day-tab add-day" id="add-day-btn">+ เพิ่มวัน</button>';

    var sortedStops = day && day.stops.length ? day.stops.slice().sort(function(a,b){
      return (a.time||'99:99').localeCompare(b.time||'99:99');
    }) : [];

    var stopsHtml = '';
    if(sortedStops.length){
      sortedStops.forEach(function(s, idx){
        if(idx > 0){
          var prev = sortedStops[idx - 1];
          stopsHtml += '<div class="leg-row" data-origin="' + escapeHtml(prev.name) + '" data-destination="' + escapeHtml(s.name) + '"></div>';
        }
        stopsHtml +=
          '<div class="stop-card">' +
            '<div class="stop-time">' + escapeHtml(s.time || '--:--') + '</div>' +
            '<div class="stop-body"><div class="name">' + escapeHtml(s.name) + mapsLinkHtml(s.name, 'maps-link-inline') + '</div>' +
              (s.note ? '<div class="note">' + escapeHtml(s.note) + '</div>' : '') +
            '</div>' +
            '<button class="icon-btn" data-del-stop="' + s.id + '" aria-label="ลบ">&times;</button>' +
          '</div>';
      });
    } else {
      stopsHtml = '<p style="color:var(--ink-soft); font-size:14px;">ยังไม่มีจุดแวะสำหรับวันนี้</p>';
    }

    content.innerHTML =
      '<div class="day-tabs">' + tabsHtml + '</div>' +
      '<div class="stop-list">' + stopsHtml + '</div>' +
      '<div class="inline-add-form">' +
        '<div class="row">' +
          '<input id="stop-time" type="time">' +
          '<input id="stop-name" type="text" placeholder="ชื่อสถานที่หรือกิจกรรม">' +
        '</div>' +
        '<div id="stop-place-picker" class="place-picker-slot"></div>' +
        '<input id="stop-note" type="text" placeholder="โน้ตเพิ่มเติม (ไม่บังคับ)">' +
        '<div class="field-error" id="stop-err"></div>' +
        '<button class="btn btn-primary" id="add-stop-btn" style="align-self:flex-start;">+ เพิ่มจุดแวะ</button>' +
      '</div>';

    content.querySelectorAll('.leg-row').forEach(function(legEl){
      var origin = legEl.getAttribute('data-origin');
      var destination = legEl.getAttribute('data-destination');
      if(!origin || !destination){
        legEl.innerHTML = '';
        return;
      }
      if(!MAPS_API_KEY){
        legEl.innerHTML = '<span class="leg-hint">ใส่ Google Maps API key ในโค้ดเพื่อดูระยะทาง/เวลาเดินทางอัตโนมัติ</span>';
        return;
      }
      legEl.innerHTML = '<span class="leg-hint loading">กำลังคำนวณระยะทาง...</span>';
      getLegDistance(origin, destination).then(function(res){
        if(!res || (!res.walk && !res.drive)){
          legEl.innerHTML = mapsAuthFailed
            ? '<span class="leg-hint">Google Maps API key ยืนยันตัวตนไม่ผ่าน — เช็คว่าเปิด API ครบและโดเมนที่จำกัดไว้ตรงกับที่ใช้งานอยู่ (ดู console เพิ่มเติม)</span>'
            : '<span class="leg-hint">คำนวณระยะทางไม่สำเร็จ ลองตั้งชื่อสถานที่ให้ชัดเจนขึ้น</span>';
          return;
        }
        legEl.innerHTML = legPillHtml('walk', res.walk) + legPillHtml('drive', res.drive);
      });
    });

    mountPlacePicker('stop-place-picker', 'stop-name');

    content.querySelectorAll('[data-day]').forEach(function(btn){
      btn.addEventListener('click', function(){
        state.currentDayId = btn.getAttribute('data-day');
        renderItinerary(trip);
      });
    });
    document.getElementById('add-day-btn').addEventListener('click', function(){
      var newDay = { id: uid('day'), label: 'วันที่ ' + (trip.days.length + 1), stops: [] };
      trip.days.push(newDay);
      state.currentDayId = newDay.id;
      apiUpsertTrip(trip).then(function(){ renderItinerary(trip); });
    });
    content.querySelectorAll('[data-del-stop]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var did = btn.getAttribute('data-del-stop');
        day.stops = day.stops.filter(function(s){ return s.id !== did; });
        apiUpsertTrip(trip).then(function(){ renderItinerary(trip); });
      });
    });
    document.getElementById('add-stop-btn').addEventListener('click', function(){
      var nameEl = document.getElementById('stop-name');
      var name = nameEl.value.trim();
      var errEl = document.getElementById('stop-err');
      if(!name){
        errEl.textContent = 'กรุณาใส่ชื่อสถานที่หรือกิจกรรม';
        return;
      }
      errEl.textContent = '';
      day.stops.push({
        id: uid('stop'),
        time: document.getElementById('stop-time').value,
        name: name,
        note: document.getElementById('stop-note').value.trim()
      });
      apiUpsertTrip(trip).then(function(){ renderItinerary(trip); });
    });
  }

  /* ----- budget ----- */

  function renderBudget(trip){
    var content = document.getElementById('subtab-content');
    var total = trip.budget.reduce(function(sum, b){ return sum + (Number(b.amount) || 0); }, 0);

    var rowsHtml = trip.budget.length ? trip.budget.map(function(b){
      return '<div class="budget-row">' +
        '<span class="cat">' + escapeHtml(b.category || 'อื่นๆ') + '</span>' +
        '<span class="item">' + escapeHtml(b.item) + '</span>' +
        '<span class="amt">฿' + money(b.amount) + '</span>' +
        '<button class="icon-btn" data-del-budget="' + b.id + '" aria-label="ลบ">&times;</button>' +
      '</div>';
    }).join('') : '<div class="mini-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9 9.5c0-1.1 1.2-1.7 3-1.7s3 .6 3 1.6c0 2.2-6 1-6 3.2 0 1 1.2 1.7 3 1.7s3-.6 3-1.7" stroke-linecap="round"/></svg><span>ยังไม่มีรายการค่าใช้จ่าย</span></div>';

    content.innerHTML =
      '<div class="budget-summary">' +
        '<div class="sum-badge total"><div class="label">รวมทั้งหมด</div><div class="value">฿' + money(total) + '</div></div>' +
        '<div class="sum-badge"><div class="label">จำนวนรายการ</div><div class="value">' + trip.budget.length + '</div></div>' +
      '</div>' +
      '<div>' + rowsHtml + '</div>' +
      '<div class="inline-add-form" style="margin-top:18px;">' +
        '<div class="row">' +
          '<select id="b-cat" style="max-width:130px;">' +
            '<option value="ที่พัก">ที่พัก</option>' +
            '<option value="เดินทาง">เดินทาง</option>' +
            '<option value="อาหาร">อาหาร</option>' +
            '<option value="กิจกรรม">กิจกรรม</option>' +
            '<option value="อื่นๆ">อื่นๆ</option>' +
          '</select>' +
          '<input id="b-item" type="text" placeholder="รายการ เช่น ตั๋วเครื่องบิน">' +
        '</div>' +
        '<input id="b-amount" type="number" min="0" step="0.01" placeholder="จำนวนเงิน (บาท)">' +
        '<div class="field-error" id="b-err"></div>' +
        '<button class="btn btn-primary" id="add-budget-btn" style="align-self:flex-start;">+ เพิ่มรายการ</button>' +
      '</div>';

    content.querySelectorAll('[data-del-budget]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var bid = btn.getAttribute('data-del-budget');
        trip.budget = trip.budget.filter(function(b){ return b.id !== bid; });
        apiUpsertTrip(trip).then(function(){ renderBudget(trip); });
      });
    });
    document.getElementById('add-budget-btn').addEventListener('click', function(){
      var itemEl = document.getElementById('b-item');
      var amountEl = document.getElementById('b-amount');
      var errEl = document.getElementById('b-err');
      var item = itemEl.value.trim();
      var amount = amountEl.value;
      if(!item || !amount || isNaN(Number(amount)) || Number(amount) < 0){
        errEl.textContent = 'กรุณาใส่ชื่อรายการและจำนวนเงินให้ถูกต้อง';
        return;
      }
      errEl.textContent = '';
      trip.budget.push({
        id: uid('bud'),
        category: document.getElementById('b-cat').value,
        item: item,
        amount: Number(amount)
      });
      apiUpsertTrip(trip).then(function(){ renderBudget(trip); });
    });
  }

  /* ----- checklist ----- */

  function renderChecklist(trip){
    var content = document.getElementById('subtab-content');
    var doneCount = trip.checklist.filter(function(c){ return c.done; }).length;

    var rowsHtml = trip.checklist.length ? trip.checklist.map(function(c){
      return '<div class="checklist-row' + (c.done ? ' done' : '') + '">' +
        '<input type="checkbox" data-toggle="' + c.id + '" ' + (c.done ? 'checked' : '') + '>' +
        '<span class="text">' + escapeHtml(c.text) + '</span>' +
        '<button class="icon-btn" data-del-check="' + c.id + '" aria-label="ลบ">&times;</button>' +
      '</div>';
    }).join('') : '<div class="mini-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="4" width="14" height="17" rx="2"/><rect x="9" y="2.5" width="6" height="3" rx="1"/><path d="M8.5 12l2 2 4-4.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>ยังไม่มีของที่ต้องเตรียม</span></div>';

    content.innerHTML =
      (trip.checklist.length ? '<p class="eyebrow" style="margin-bottom:12px;">เตรียมแล้ว ' + doneCount + ' / ' + trip.checklist.length + '</p>' : '') +
      '<div>' + rowsHtml + '</div>' +
      '<div class="add-inline-row">' +
        '<input id="check-text" type="text" placeholder="เช่น จองที่พัก, เตรียมยา">' +
        '<button class="btn btn-primary" id="add-check-btn">+ เพิ่ม</button>' +
      '</div>' +
      '<div class="field-error" id="check-err"></div>';

    content.querySelectorAll('[data-toggle]').forEach(function(box){
      box.addEventListener('change', function(){
        var cid = box.getAttribute('data-toggle');
        var c = trip.checklist.find(function(x){ return x.id === cid; });
        if(c) c.done = box.checked;
        apiUpsertTrip(trip).then(function(){ renderChecklist(trip); });
      });
    });
    content.querySelectorAll('[data-del-check]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var cid = btn.getAttribute('data-del-check');
        trip.checklist = trip.checklist.filter(function(c){ return c.id !== cid; });
        apiUpsertTrip(trip).then(function(){ renderChecklist(trip); });
      });
    });
    document.getElementById('add-check-btn').addEventListener('click', function(){
      var textEl = document.getElementById('check-text');
      var text = textEl.value.trim();
      if(!text){
        document.getElementById('check-err').textContent = 'กรุณาใส่ข้อความก่อนเพิ่ม';
        return;
      }
      document.getElementById('check-err').textContent = '';
      trip.checklist.push({ id: uid('chk'), text: text, done: false });
      textEl.value = '';
      apiUpsertTrip(trip).then(function(){ renderChecklist(trip); });
    });
  }

  /* ----- debts ----- */

  function renderDebts(trip){
    var content = document.getElementById('subtab-content');
    var debts = trip.debts || [];

    var owedToMe = debts.filter(function(d){ return !d.settled && d.lender.toLowerCase() === state.user.toLowerCase(); })
      .reduce(function(sum, d){ return sum + Number(d.amount || 0); }, 0);
    var iOwe = debts.filter(function(d){ return !d.settled && d.borrower.toLowerCase() === state.user.toLowerCase(); })
      .reduce(function(sum, d){ return sum + Number(d.amount || 0); }, 0);

    var rowsHtml = debts.length ? debts.slice().sort(function(a,b){ return (a.settled?1:0) - (b.settled?1:0); }).map(function(d){
      return '<div class="debt-row' + (d.settled ? ' settled' : '') + '">' +
        '<div class="debt-who"><b>' + escapeHtml(d.borrower) + '</b> ค้าง <b>' + escapeHtml(d.lender) + '</b>' +
          (d.note ? '<div class="note">' + escapeHtml(d.note) + '</div>' : '') +
        '</div>' +
        '<div class="debt-amt">฿' + money(d.amount) + '</div>' +
        '<button class="btn btn-ghost debt-settle-btn" data-toggle-debt="' + d.id + '">' + (d.settled ? 'จ่ายแล้ว' : 'ยังไม่จ่าย') + '</button>' +
        '<button class="icon-btn" data-del-debt="' + d.id + '" aria-label="ลบ">&times;</button>' +
      '</div>';
    }).join('') : '<div class="mini-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 8h13M13 4l4 4-4 4" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 16H7M11 12l-4 4 4 4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>ยังไม่มีรายการค้างเงินในทริปนี้</span></div>';

    var people = (trip.participants && trip.participants.length) ? trip.participants.slice() : [state.user];
    if(people.indexOf(state.user) === -1) people.unshift(state.user);

    function peopleOptions(selected){
      return people.map(function(p){
        return '<option value="' + escapeHtml(p) + '"' + (p === selected ? ' selected' : '') + '>' + escapeHtml(p) + '</option>';
      }).join('') + '<option value="__custom__">อื่นๆ (พิมพ์ชื่อเอง)</option>';
    }

    var borrowerChecksHtml = people.map(function(p){
      return '<label class="person-check"><input type="checkbox" class="d-borrower-check" value="' + escapeHtml(p) + '"> ' + escapeHtml(p) + '</label>';
    }).join('');

    content.innerHTML =
      '<div class="budget-summary">' +
        '<div class="sum-badge"><div class="label">คนอื่นค้างคุณ</div><div class="value">฿' + money(owedToMe) + '</div></div>' +
        '<div class="sum-badge total"><div class="label">คุณค้างคนอื่น</div><div class="value">฿' + money(iOwe) + '</div></div>' +
      '</div>' +
      '<div>' + rowsHtml + '</div>' +
      '<div class="inline-add-form" style="margin-top:18px;">' +
        '<label style="font-size:13px; font-weight:600; color:var(--ink-soft);">คนที่เป็นหนี้ (เลือกได้หลายคน)</label>' +
        '<label class="person-check" style="font-weight:600;"><input type="checkbox" id="d-select-all"> เลือกทุกคนในทริป</label>' +
        '<div class="person-check-grid">' + borrowerChecksHtml + '</div>' +
        '<input id="d-borrower-extra" type="text" placeholder="เพิ่มชื่อคนอื่นที่ไม่อยู่ในลิสต์ (คั่นด้วยจุลภาค, ไม่บังคับ)">' +
        '<label style="font-size:13px; font-weight:600; color:var(--ink-soft); margin-top:10px;">คนให้ยืม (คนที่จ่ายไปก่อน)</label>' +
        '<select id="d-lender">' + peopleOptions(state.user) + '</select>' +
        '<input id="d-lender-custom" type="text" placeholder="พิมพ์ชื่อคนให้ยืม" class="hide">' +
        '<input id="d-amount" type="number" min="0" step="0.01" placeholder="ยอดรวมค่าใช้จ่ายทั้งหมด (บาท) — ระบบจะหารตามจำนวนคนที่เลือกให้อัตโนมัติ">' +
        '<input id="d-note" type="text" placeholder="โน้ต เช่น ค่าตั๋วเรือ (ไม่บังคับ)">' +
        '<div class="field-error" id="d-err"></div>' +
        '<button class="btn btn-primary" id="add-debt-btn" style="align-self:flex-start;">+ เพิ่มรายการค้างเงิน</button>' +
      '</div>';

    var borrowerChecks = content.querySelectorAll('.d-borrower-check');
    document.getElementById('d-select-all').addEventListener('change', function(e){
      borrowerChecks.forEach(function(cb){ cb.checked = e.target.checked; });
    });

    function wirePersonSelect(selectId, customId){
      var sel = document.getElementById(selectId);
      var custom = document.getElementById(customId);
      sel.addEventListener('change', function(){
        custom.classList.toggle('hide', sel.value !== '__custom__');
        if(sel.value === '__custom__') custom.focus();
      });
    }
    wirePersonSelect('d-lender', 'd-lender-custom');

    content.querySelectorAll('[data-toggle-debt]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var did = btn.getAttribute('data-toggle-debt');
        var d = debts.find(function(x){ return x.id === did; });
        if(d) d.settled = !d.settled;
        apiUpsertTrip(trip).then(function(){ renderDebts(trip); });
      });
    });
    content.querySelectorAll('[data-del-debt]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var did = btn.getAttribute('data-del-debt');
        trip.debts = debts.filter(function(d){ return d.id !== did; });
        apiUpsertTrip(trip).then(function(){ renderDebts(trip); });
      });
    });
    document.getElementById('add-debt-btn').addEventListener('click', function(){
      var lenderSel = document.getElementById('d-lender');
      var amountEl = document.getElementById('d-amount');
      var errEl = document.getElementById('d-err');
      var lender = lenderSel.value === '__custom__' ? document.getElementById('d-lender-custom').value.trim() : lenderSel.value;

      var borrowers = [];
      content.querySelectorAll('.d-borrower-check:checked').forEach(function(cb){
        if(borrowers.indexOf(cb.value) === -1) borrowers.push(cb.value);
      });
      document.getElementById('d-borrower-extra').value.split(',').forEach(function(name){
        name = name.trim();
        if(name && borrowers.indexOf(name) === -1) borrowers.push(name);
      });
      borrowers = borrowers.filter(function(b){ return b.toLowerCase() !== (lender || '').toLowerCase(); });

      var amount = amountEl.value;
      if(!lender || borrowers.length === 0 || !amount || isNaN(Number(amount)) || Number(amount) <= 0){
        errEl.textContent = 'กรุณาเลือกคนที่เป็นหนี้อย่างน้อย 1 คน เลือกคนให้ยืม และใส่ยอดรวมให้ถูกต้อง';
        return;
      }
      errEl.textContent = '';

      var perPerson = Math.round((Number(amount) / borrowers.length) * 100) / 100;
      var baseNote = document.getElementById('d-note').value.trim();
      var splitNote = borrowers.length > 1 ? 'หารเท่ากัน ' + borrowers.length + ' คน จากยอดรวม ฿' + money(amount) : '';
      var note = [baseNote, splitNote].filter(Boolean).join(' — ');

      var newDebts = borrowers.map(function(b){
        return {
          id: uid('debt'),
          borrower: b,
          lender: lender,
          amount: perPerson,
          note: note,
          settled: false
        };
      });
      trip.debts = debts.concat(newDebts);
      apiUpsertTrip(trip).then(function(){ renderDebts(trip); });
    });
  }

})();
</script>
</body>
</html>
