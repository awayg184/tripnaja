<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สมุดเดินทาง — Trip Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Noto+Serif+Thai:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F6F1FA;
    --paper-raised: #FCFAFE;
    --ink: #362D4C;
    --ink-soft: #675D80;
    --line: #E5DBF0;
    --line-soft: #EFE7F7;
    --coral: #F3B9C7;
    --coral-dark: #B24F70;
    --teal: #AEE1D6;
    --teal-dark: #337367;
    --plum: #8478B0;
    --plum-dark: #6A5F94;
    --gold: #B4863A;
    --danger: #B84F4F;
    --radius: 14px;
    --shadow: 0 1px 0 rgba(54,45,76,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(75,68,96,0.05) 1px, transparent 0);
    background-size: 22px 22px;
    color: var(--ink);
    font-family: 'Noto Sans Thai', -apple-system, sans-serif;
    min-height: 100vh;
  }
  h1,h2,h3{ font-family: 'Noto Serif Thai', serif; font-weight: 700; margin: 0; }
  .eyebrow{
    font-family: 'IBM Plex Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-size: 11px;
    color: var(--ink-soft);
  }
  button{ font-family: inherit; cursor: pointer; }
  input, select, textarea{
    font-family: 'Noto Sans Thai', sans-serif;
    font-size: 15px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    color: var(--ink);
    width: 100%;
  }
  input:focus, select:focus, textarea:focus, button:focus-visible{
    outline: 2px solid var(--coral);
    outline-offset: 1px;
  }
  .btn{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 18px;
    border-radius: 999px;
    border: 1px solid var(--ink);
    background: transparent;
    color: var(--ink);
    font-weight: 600;
    font-size: 14px;
    transition: transform 0.12s ease, background 0.12s ease;
  }
  .btn:hover{ background: rgba(75,68,96,0.06); }
  .btn:active{ transform: scale(0.97); }
  .btn-primary{
    background: var(--coral-dark);
    border-color: var(--coral-dark);
    color: #fff;
  }
  .btn-primary:hover{ background: #96395A; border-color: #96395A; }
  .btn-ghost{
    border-color: transparent;
    color: var(--ink-soft);
  }
  .btn-ghost:hover{ background: rgba(75,68,96,0.06); color: var(--ink); }
  .btn-danger{ border-color: var(--danger); color: var(--danger); }
  .btn-danger:hover{ background: rgba(201,120,120,0.1); }
  .btn:disabled{ opacity: 0.45; cursor: not-allowed; }
  .btn:disabled:hover{ background: transparent; }

  #app{ max-width: 860px; margin: 0 auto; padding: 32px 20px 80px; }
  .hide{ display: none !important; }

  /* ---------- login ---------- */
  #login-view{
    min-height: calc(100vh - 64px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .passport{
    width: 100%;
    max-width: 380px;
    background: var(--plum);
    color: #FAF6FF;
    border-radius: 18px;
    padding: 40px 32px;
    box-shadow: 0 18px 40px -20px rgba(132,120,176,0.55);
    position: relative;
    overflow: hidden;
  }
  .passport::before{
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px solid rgba(250,246,255,0.28);
    border-radius: 10px;
    pointer-events: none;
  }
  .passport .mark{
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 13px;
    letter-spacing: 0.08em;
    color: rgba(250,246,255,0.7);
    margin-bottom: 4px;
  }
  .passport h1{
    font-size: 28px;
    color: #FAF6FF;
    margin-bottom: 6px;
  }
  .passport p.sub{
    font-size: 13.5px;
    color: rgba(250,246,255,0.78);
    margin: 0 0 28px;
    line-height: 1.6;
  }
  .passport label{
    display:block;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-family: 'IBM Plex Mono', monospace;
    color: rgba(250,246,255,0.65);
    margin-bottom: 6px;
  }
  .passport input{
    background: rgba(250,246,255,0.12);
    border: 1px solid rgba(250,246,255,0.32);
    color: #FAF6FF;
    margin-bottom: 16px;
  }
  .passport input::placeholder{ color: rgba(250,246,255,0.45); }
  .passport .btn-primary{ width: 100%; padding: 12px; font-size: 15px; }
  .remember-box{
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px dashed rgba(250,246,255,0.28);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13.5px;
  }
  .login-error{
    color: #FFC9DA;
    font-size: 13px;
    margin: -10px 0 14px;
    min-height: 16px;
  }

  /* ---------- header / tabs ---------- */
  header.top{
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
    gap: 12px;
    flex-wrap: wrap;
  }
  header.top .who{ display:flex; align-items:center; gap:10px; }
  .avatar-stamp{
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 1.5px dashed var(--coral-dark);
    display: flex; align-items:center; justify-content:center;
    font-family: 'Noto Serif Thai', serif;
    font-weight: 700;
    color: var(--coral-dark);
    background: rgba(201,107,135,0.1);
    flex-shrink: 0;
  }
  .tabs{
    display: flex;
    gap: 4px;
    background: rgba(75,68,96,0.06);
    padding: 4px;
    border-radius: 999px;
    width: fit-content;
    margin-bottom: 22px;
  }
  .tab-btn{
    border: none;
    background: transparent;
    padding: 9px 18px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 14px;
    color: var(--ink-soft);
  }
  .tab-btn.active{ background: var(--ink); color: #FAF6FF; }

  /* ---------- trip cards ---------- */
  .trip-grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }
  .trip-card{
    background: var(--paper-raised);
    border: 1px solid var(--line-soft);
    border-radius: var(--radius);
    padding: 18px 18px 16px;
    cursor: pointer;
    position: relative;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .trip-card:hover{ border-color: var(--coral); transform: translateY(-2px); }
  .trip-card .stamp{
    position: absolute;
    top: 14px; right: 14px;
    width: 54px; height: 54px;
    border-radius: 50%;
    border: 1.5px dashed var(--teal-dark);
    color: var(--teal-dark);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    transform: rotate(-8deg);
    font-family: 'IBM Plex Mono', monospace;
    line-height: 1.05;
    text-align: center;
  }
  .trip-card .stamp b{ font-size: 15px; }
  .trip-card .stamp span{ font-size: 8px; letter-spacing: 0.05em; }
  .trip-card .dest{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--coral-dark);
    margin-bottom: 6px;
  }
  .trip-card h3{ font-size: 19px; margin-bottom: 8px; max-width: 70%; }
  .trip-card .dates{ font-size: 13px; color: var(--ink-soft); margin-bottom: 10px; }
  .trip-card .owner-tag{
    font-size: 11.5px;
    color: var(--ink-soft);
    font-family: 'IBM Plex Mono', monospace;
  }
  .empty-state{
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-soft);
  }
  .empty-state h3{ color: var(--ink); margin-bottom: 8px; font-size: 20px; }
  .empty-state p{ margin: 0 0 20px; font-size: 14px; }
  .fab-row{ margin-bottom: 22px; }

  /* ---------- modal ---------- */
  .modal-backdrop{
    position: fixed; inset: 0;
    background: rgba(75,68,96,0.4);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    z-index: 50;
  }
  .modal{
    background: var(--paper-raised);
    border-radius: 18px;
    padding: 28px;
    width: 100%;
    max-width: 440px;
    max-height: 88vh;
    overflow-y: auto;
  }
  .modal h2{ font-size: 21px; margin-bottom: 18px; }
  .field{ margin-bottom: 14px; }
  .field label{
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .field-error{ color: var(--danger); font-size: 12.5px; margin-top: 4px; }
  .radio-row{ display: flex; gap: 10px; }
  .radio-card{
    flex: 1;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    display: flex; align-items: center; gap: 8px;
    font-size: 13.5px;
    cursor: pointer;
  }
  .radio-card.selected{ border-color: var(--coral-dark); background: rgba(201,107,135,0.08); }
  .row2{ display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal-actions{ display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

  /* ---------- trip detail ---------- */
  .detail-header{ margin-bottom: 18px; }
  .back-link{
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--ink-soft); font-size: 13.5px; margin-bottom: 14px;
    border: none; background: none; padding: 0; font-weight: 600;
  }
  .back-link:hover{ color: var(--ink); }
  .detail-header .dest{ font-family:'IBM Plex Mono', monospace; font-size:12px; text-transform:uppercase; letter-spacing:0.08em; color:var(--coral-dark); }
  .detail-header h1{ font-size: 30px; margin: 6px 0 6px; }
  .detail-header .meta-row{ display:flex; gap:14px; flex-wrap:wrap; align-items:center; color: var(--ink-soft); font-size: 13.5px; }
  .visibility-pill{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 3px 10px;
    border-radius: 999px;
    border: 1px solid var(--line);
  }
  .visibility-pill.shared{ border-color: var(--teal); color: var(--teal-dark); }
  .visibility-pill.private{ border-color: var(--gold); color: var(--gold); }

  .subtabs{ display:flex; gap: 6px; border-bottom: 1px solid var(--line-soft); margin: 22px 0 20px; }
  .subtab-btn{
    background: none; border: none; padding: 10px 4px;
    font-size: 14.5px; font-weight: 600; color: var(--ink-soft);
    border-bottom: 2px solid transparent; margin-right: 18px;
  }
  .subtab-btn.active{ color: var(--ink); border-bottom-color: var(--coral); }

  .day-tabs{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom: 16px; }
  .day-tab{
    padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line);
    background: #fff; font-size: 13px; font-weight: 600; color: var(--ink-soft);
  }
  .day-tab.active{ background: var(--ink); border-color: var(--ink); color: #FAF6FF; }
  .day-tab.add-day{ border-style: dashed; color: var(--coral-dark); border-color: var(--coral); background: transparent; }

  .stop-list{ display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .stop-card{
    background: #fff; border: 1px solid var(--line-soft); border-radius: 12px;
    padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start;
  }
  .stop-time{
    font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--teal-dark);
    min-width: 48px; padding-top: 2px; flex-shrink: 0;
  }
  .stop-body{ flex: 1; }
  .stop-body .name{ font-weight: 600; font-size: 14.5px; }
  .stop-body .note{ font-size: 13px; color: var(--ink-soft); margin-top: 2px; }
  .icon-btn{
    border: none; background: none; color: var(--ink-soft); padding: 4px;
    border-radius: 6px; font-size: 16px; line-height: 1;
  }
  .icon-btn:hover{ background: rgba(201,120,120,0.12); color: var(--danger); }

  .inline-add-form{
    background: #fff; border: 1px dashed var(--line); border-radius: 12px;
    padding: 14px; display: flex; flex-direction: column; gap: 10px;
  }
  .inline-add-form .row{ display: flex; gap: 10px; }
  .inline-add-form .row input:first-child{ max-width: 100px; }

  .budget-summary{
    display: flex; gap: 14px; margin-bottom: 18px; flex-wrap: wrap;
  }
  .sum-badge{
    background: var(--paper-raised); border: 1px solid var(--line-soft);
    border-radius: 12px; padding: 12px 18px; min-width: 130px;
  }
  .sum-badge .label{ font-size: 11.5px; color: var(--ink-soft); font-family:'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:0.05em; }
  .sum-badge .value{ font-family:'Noto Serif Thai',serif; font-weight:700; font-size: 22px; margin-top: 2px; }
  .sum-badge.total .value{ color: var(--coral-dark); }

  .budget-row{
    display: flex; align-items:center; gap: 12px; padding: 10px 0;
    border-bottom: 1px solid var(--line-soft);
  }
  .budget-row .cat{
    font-size: 11px; font-family:'IBM Plex Mono',monospace; text-transform:uppercase;
    color: var(--teal-dark); background: rgba(95,165,153,0.12);
    padding: 3px 8px; border-radius: 999px; flex-shrink:0;
  }
  .budget-row .item{ flex: 1; font-size: 14.5px; }
  .budget-row .amt{ font-family:'IBM Plex Mono',monospace; font-size: 14px; font-weight: 500; }

  .checklist-row{
    display: flex; align-items: center; gap: 10px; padding: 9px 0;
    border-bottom: 1px solid var(--line-soft);
  }
  .checklist-row input[type=checkbox]{ width: 18px; height: 18px; flex-shrink: 0; accent-color: var(--coral); }
  .checklist-row .text{ flex: 1; font-size: 14.5px; }
  .checklist-row.done .text{ text-decoration: line-through; color: var(--ink-soft); }

  .add-inline-row{ display: flex; gap: 10px; margin-top: 14px; }
  .add-inline-row input{ flex: 1; }

  @media (max-width: 520px){
    .row2{ grid-template-columns: 1fr; }
    .detail-header h1{ font-size: 24px; }
  }
</style>
</head>
<body>

<div id="app">

  <div id="login-view" class="hide">
    <div class="passport">
      <div class="mark">Travel Journal</div>
      <h1>สมุดเดินทาง</h1>
      <p class="sub" id="login-sub">ใส่ไอดีของคุณเพื่อเริ่มวางแผนทริป — ไม่ต้องใช้รหัสผ่าน ข้อมูลซิงก์กับ Google Sheet</p>
      <div id="login-error" class="login-error"></div>
      <label for="name-input">ไอดีของคุณ</label>
      <input id="name-input" type="text" placeholder="เช่น พีท" autocomplete="off">
      <button class="btn btn-primary" id="login-btn">เข้าสู่สมุดเดินทาง</button>
      <div class="remember-box hide" id="remember-box">
        <span>จำไอดีไว้ในเครื่องนี้แล้ว</span>
        <button class="btn btn-ghost" id="forget-btn" style="color:#FAF6FF; border-color: rgba(250,246,255,0.32);">ลืมฉัน</button>
      </div>
    </div>
  </div>

  <div id="main-view" class="hide">
    <header class="top">
      <div class="who">
        <div class="avatar-stamp" id="avatar-initial">A</div>
        <div>
          <div style="font-weight:700; font-size:15px;" id="who-name">-</div>
          <div class="eyebrow" id="who-sub">นักเดินทาง</div>
        </div>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-ghost" id="logout-btn">ออกจากระบบ</button>
      </div>
    </header>

    <div id="dashboard-view">
      <div class="tabs">
        <button class="tab-btn active" data-scope="private">ทริปของฉัน</button>
        <button class="tab-btn" data-scope="shared">ทริปรวม</button>
      </div>
      <div class="fab-row">
        <button class="btn btn-primary" id="new-trip-btn">+ สร้างทริปใหม่</button>
      </div>
      <div id="trip-grid" class="trip-grid"></div>
    </div>

    <div id="detail-view" class="hide"></div>
  </div>
</div>

<div id="modal-root"></div>

<script>
(function(){

  var state = {
    user: null,
    trips: [],
    scope: 'private',
    currentTripId: null,
    currentDayId: null,
    subtab: 'itinerary'
  };

  function uid(prefix){
    return (prefix || 'id') + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,8);
  }

  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function fmtDate(d){
    if(!d) return '';
    try{
      var parts = d.split('-');
      var dt = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
      return dt.toLocaleDateString('th-TH', { day:'numeric', month:'short', year:'numeric' });
    }catch(e){ return d; }
  }

  function dayCount(start, end){
    if(!start || !end) return null;
    var a = new Date(start), b = new Date(end);
    var diff = Math.round((b-a)/86400000);
    return diff >= 0 ? diff + 1 : null;
  }

  function money(n){
    n = Number(n) || 0;
    return n.toLocaleString('th-TH', {maximumFractionDigits: 2});
  }

  /* ---------------- storage (Google Sheets via Apps Script) ---------------- */

  var API_URL_KEY = 'trip-planner-api-url';
  var REMEMBER_KEY = 'trip-planner-remembered-user';
  var DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbw-0kPDG_A0n3gyojfXHxCnAMl9U9pSAqKUKfhQMwE6DQyzZrekg4hcnSE5wYhliwkz/exec';

  function getApiUrl(){
    try{ return localStorage.getItem(API_URL_KEY) || DEFAULT_API_URL; }catch(e){ return DEFAULT_API_URL; }
  }
  function setApiUrl(url){
    try{ localStorage.setItem(API_URL_KEY, url); }catch(e){}
  }

  function apiListTrips(){
    var url = getApiUrl();
    return fetch(url + '?action=list').then(function(res){
      if(!res.ok) throw new Error('network');
      return res.json();
    }).then(function(data){
      if(data && data.error) throw new Error(data.error);
      return Array.isArray(data) ? data : [];
    });
  }

  function apiUpsertTrip(trip){
    var url = getApiUrl();
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'upsert', trip: trip })
    }).then(function(res){ return res.json(); }).catch(function(err){
      console.error('upsert failed', err);
      alert('บันทึกไป Google Sheet ไม่สำเร็จ ลองอีกครั้ง');
      throw err;
    });
  }

  function apiDeleteTrip(id){
    var url = getApiUrl();
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'delete', id: id })
    }).then(function(res){ return res.json(); }).catch(function(err){
      console.error('delete failed', err);
      alert('ลบข้อมูลใน Google Sheet ไม่สำเร็จ ลองอีกครั้ง');
      throw err;
    });
  }

  function loadTrips(){
    return apiListTrips().then(function(trips){
      state.trips = trips;
    }).catch(function(){
      state.trips = [];
      alert('โหลดข้อมูลจาก Google Sheet ไม่สำเร็จ ตรวจสอบลิงก์ Apps Script ในหน้าตั้งค่าอีกครั้ง');
    });
  }

  function loadRememberedUser(){
    try{ return Promise.resolve(localStorage.getItem(REMEMBER_KEY) || null); }
    catch(e){ return Promise.resolve(null); }
  }

  function rememberUser(name){
    try{ localStorage.setItem(REMEMBER_KEY, name); }catch(e){}
    return Promise.resolve();
  }

  function forgetUser(){
    try{ localStorage.removeItem(REMEMBER_KEY); }catch(e){}
    return Promise.resolve();
  }

  /* ---------------- login ---------------- */

  var nameInput = document.getElementById('name-input');
  var loginBtn = document.getElementById('login-btn');
  var loginError = document.getElementById('login-error');
  var rememberBox = document.getElementById('remember-box');
  var forgetBtn = document.getElementById('forget-btn');
  var loginSub = document.getElementById('login-sub');

  function doLogin(name, opts){
    name = (name || '').trim();
    if(!name){
      loginError.textContent = 'กรุณาใส่ไอดีก่อนเข้าสู่ระบบ';
      nameInput.focus();
      return;
    }
    loginError.textContent = '';
    state.user = name;
    if(!opts || opts.remember !== false){
      rememberUser(name);
    }
    loginBtn.disabled = true;
    loginBtn.textContent = 'กำลังเชื่อมต่อ...';
    loadTrips().then(function(){
      loginBtn.disabled = false;
      loginBtn.textContent = 'เข้าสู่สมุดเดินทาง';
      document.getElementById('who-name').textContent = name;
      document.getElementById('avatar-initial').textContent = name.trim()[0].toUpperCase();
      document.getElementById('login-view').classList.add('hide');
      document.getElementById('main-view').classList.remove('hide');
      renderDashboard();
    });
  }

  loginBtn.addEventListener('click', function(){ doLogin(nameInput.value); });
  nameInput.addEventListener('keydown', function(e){ if(e.key === 'Enter') doLogin(nameInput.value); });
  nameInput.addEventListener('input', function(){ loginError.textContent = ''; });

  forgetBtn.addEventListener('click', function(){
    forgetUser().then(function(){
      nameInput.value = '';
      rememberBox.classList.add('hide');
      loginSub.textContent = 'ใส่ไอดีของคุณเพื่อเริ่มวางแผนทริป — ไม่ต้องใช้รหัสผ่าน ข้อมูลซิงก์กับ Google Sheet';
    });
  });

  document.getElementById('logout-btn').addEventListener('click', function(){
    state.user = null;
    document.getElementById('main-view').classList.add('hide');
    document.getElementById('login-view').classList.remove('hide');
  });

  document.getElementById('login-view').classList.remove('hide');

  loadRememberedUser().then(function(name){
    if(name){
      nameInput.value = name;
      rememberBox.classList.remove('hide');
      loginSub.textContent = 'ยินดีต้อนรับกลับมา กด "เข้าสู่สมุดเดินทาง" เพื่อไปต่อ หรือแก้ไอดีได้เลย';
    }
  });

  /* ---------------- dashboard ---------------- */

  var tabBtns = document.querySelectorAll('.tab-btn');
  tabBtns.forEach(function(btn){
    btn.addEventListener('click', function(){
      tabBtns.forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      state.scope = btn.getAttribute('data-scope');
      renderTripGrid();
    });
  });

  document.getElementById('new-trip-btn').addEventListener('click', function(){
    openTripModal();
  });

  function visibleTrips(){
    return state.trips.filter(function(t){
      if(state.scope === 'shared') return t.visibility === 'shared';
      return t.visibility === 'private' && t.owner === state.user;
    }).sort(function(a,b){ return (b.createdAt||0) - (a.createdAt||0); });
  }

  function renderDashboard(){
    document.getElementById('detail-view').classList.add('hide');
    document.getElementById('dashboard-view').classList.remove('hide');
    renderTripGrid();
  }

  function renderTripGrid(){
    var grid = document.getElementById('trip-grid');
    var trips = visibleTrips();
    if(trips.length === 0){
      grid.innerHTML = '';
      var wrap = document.createElement('div');
      wrap.className = 'empty-state';
      wrap.style.gridColumn = '1 / -1';
      wrap.innerHTML = state.scope === 'shared'
        ? '<h3>ยังไม่มีทริปรวม</h3><p>สร้างทริปแล้วเลือก "ทริปรวม" ให้ทุกคนเห็นและช่วยกันวางแผนได้</p>'
        : '<h3>ยังไม่มีทริปส่วนตัว</h3><p>เริ่มสร้างทริปแรกของคุณ — เห็นได้แค่คุณคนเดียว</p>';
      grid.appendChild(wrap);
      return;
    }
    grid.innerHTML = trips.map(function(t){
      var dc = dayCount(t.startDate, t.endDate);
      var dateStr = t.startDate ? (fmtDate(t.startDate) + (t.endDate && t.endDate !== t.startDate ? ' – ' + fmtDate(t.endDate) : '')) : 'ยังไม่กำหนดวัน';
      return '<div class="trip-card" data-id="' + t.id + '">' +
        '<div class="stamp"><b>' + (dc || '?') + '</b><span>' + (dc ? 'วัน' : '') + '</span></div>' +
        '<div class="dest">' + escapeHtml(t.destination || 'จุดหมายลับ') + '</div>' +
        '<h3>' + escapeHtml(t.title) + '</h3>' +
        '<div class="dates">' + dateStr + '</div>' +
        (state.scope === 'shared' ? '<div class="owner-tag">โดย ' + escapeHtml(t.owner) + '</div>' : '') +
        '</div>';
    }).join('');
    grid.querySelectorAll('.trip-card').forEach(function(card){
      card.addEventListener('click', function(){
        openTripDetail(card.getAttribute('data-id'));
      });
    });
  }

  /* ---------------- create/edit trip modal ---------------- */

  function openTripModal(){
    var root = document.getElementById('modal-root');
    root.innerHTML =
      '<div class="modal-backdrop" id="modal-backdrop">' +
        '<div class="modal">' +
          '<h2>สร้างทริปใหม่</h2>' +
          '<div class="field">' +
            '<label>ชื่อทริป</label>' +
            '<input id="m-title" type="text" placeholder="เช่น ทริปเกาะสมุยปลายปี">' +
            '<div class="field-error" id="err-title"></div>' +
          '</div>' +
          '<div class="field">' +
            '<label>จุดหมาย</label>' +
            '<input id="m-dest" type="text" placeholder="เช่น เกาะสมุย, ประเทศไทย">' +
          '</div>' +
          '<div class="field row2">' +
            '<div><label>วันที่เริ่ม</label><input id="m-start" type="date"></div>' +
            '<div><label>วันที่สิ้นสุด</label><input id="m-end" type="date"></div>' +
          '</div>' +
          '<div class="field">' +
            '<label>ใครมองเห็นได้</label>' +
            '<div class="radio-row">' +
              '<div class="radio-card selected" id="m-vis-private" data-v="private"><span>&#128274;</span> ส่วนตัว (เห็นคนเดียว)</div>' +
              '<div class="radio-card" id="m-vis-shared" data-v="shared"><span>&#127760;</span> รวม (เห็นทุกคน)</div>' +
            '</div>' +
          '</div>' +
          '<div class="modal-actions">' +
            '<button class="btn btn-ghost" id="m-cancel">ยกเลิก</button>' +
            '<button class="btn btn-primary" id="m-save">สร้างทริป</button>' +
          '</div>' +
        '</div>' +
      '</div>';

    var vis = 'private';
    var visPrivate = document.getElementById('m-vis-private');
    var visShared = document.getElementById('m-vis-shared');
    visPrivate.addEventListener('click', function(){
      vis = 'private';
      visPrivate.classList.add('selected');
      visShared.classList.remove('selected');
    });
    visShared.addEventListener('click', function(){
      vis = 'shared';
      visShared.classList.add('selected');
      visPrivate.classList.remove('selected');
    });

    document.getElementById('m-cancel').addEventListener('click', closeModal);
    document.getElementById('modal-backdrop').addEventListener('click', function(e){
      if(e.target.id === 'modal-backdrop') closeModal();
    });

    document.getElementById('m-save').addEventListener('click', function(){
      var title = document.getElementById('m-title').value.trim();
      var errEl = document.getElementById('err-title');
      if(!title){
        errEl.textContent = 'กรุณาตั้งชื่อทริปก่อน';
        return;
      }
      errEl.textContent = '';
      var trip = {
        id: uid('trip'),
        owner: state.user,
        visibility: vis,
        title: title,
        destination: document.getElementById('m-dest').value.trim(),
        startDate: document.getElementById('m-start').value,
        endDate: document.getElementById('m-end').value,
        days: [],
        budget: [],
        checklist: [],
        createdAt: Date.now()
      };
      state.trips.push(trip);
      apiUpsertTrip(trip).then(function(){
        closeModal();
        state.scope = vis;
        tabBtns.forEach(function(b){
          b.classList.toggle('active', b.getAttribute('data-scope') === vis);
        });
        openTripDetail(trip.id);
      });
    });
  }

  function closeModal(){
    document.getElementById('modal-root').innerHTML = '';
  }

  /* ---------------- trip detail ---------------- */

  function findTrip(id){
    for(var i=0;i<state.trips.length;i++){
      if(state.trips[i].id === id) return state.trips[i];
    }
    return null;
  }

  function openTripDetail(id){
    state.currentTripId = id;
    var trip = findTrip(id);
    if(!trip) return renderDashboard();
    if(trip.days.length === 0){
      trip.days.push({ id: uid('day'), label: 'วันที่ 1', stops: [] });
    }
    state.currentDayId = trip.days[0].id;
    state.subtab = 'itinerary';
    document.getElementById('dashboard-view').classList.add('hide');
    document.getElementById('detail-view').classList.remove('hide');
    renderTripDetail();
  }

  function backToDashboard(){
    state.currentTripId = null;
    renderDashboard();
  }

  function renderTripDetail(){
    var trip = findTrip(state.currentTripId);
    if(!trip) return backToDashboard();
    var canEdit = trip.owner === state.user || trip.visibility === 'shared';
    var wrap = document.getElementById('detail-view');
    var dateStr = trip.startDate ? (fmtDate(trip.startDate) + (trip.endDate && trip.endDate !== trip.startDate ? ' – ' + fmtDate(trip.endDate) : '')) : 'ยังไม่กำหนดวัน';

    wrap.innerHTML =
      '<button class="back-link" id="back-btn">&larr; กลับไปหน้ารวมทริป</button>' +
      '<div class="detail-header">' +
        '<div class="dest">' + escapeHtml(trip.destination || 'จุดหมายลับ') + '</div>' +
        '<h1>' + escapeHtml(trip.title) + '</h1>' +
        '<div class="meta-row">' +
          '<span>' + dateStr + '</span>' +
          '<span class="visibility-pill ' + trip.visibility + '">' + (trip.visibility === 'shared' ? 'ทริปรวม' : 'ทริปส่วนตัว') + '</span>' +
          '<span class="eyebrow">โดย ' + escapeHtml(trip.owner) + '</span>' +
        '</div>' +
      '</div>' +
      '<div class="subtabs">' +
        '<button class="subtab-btn" data-sub="itinerary">แผนการเดินทาง</button>' +
        '<button class="subtab-btn" data-sub="budget">งบประมาณ</button>' +
        '<button class="subtab-btn" data-sub="checklist">เช็คลิสต์</button>' +
      '</div>' +
      '<div id="subtab-content"></div>' +
      '<div style="margin-top:28px;">' +
        (trip.owner === state.user ? '<button class="btn btn-danger" id="delete-trip-btn">ลบทริปนี้</button>' : '') +
      '</div>';

    document.getElementById('back-btn').addEventListener('click', backToDashboard);
    var subBtns = wrap.querySelectorAll('.subtab-btn');
    subBtns.forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-sub') === state.subtab);
      b.addEventListener('click', function(){
        state.subtab = b.getAttribute('data-sub');
        renderTripDetail();
      });
    });
    var delBtn = document.getElementById('delete-trip-btn');
    if(delBtn){
      delBtn.addEventListener('click', function(){
        if(confirm('ลบทริป "' + trip.title + '" ใช่ไหม? ลบแล้วกู้คืนไม่ได้')){
          apiDeleteTrip(trip.id).then(function(){
            state.trips = state.trips.filter(function(t){ return t.id !== trip.id; });
            backToDashboard();
          });
        }
      });
    }

    if(state.subtab === 'itinerary') renderItinerary(trip);
    else if(state.subtab === 'budget') renderBudget(trip);
    else renderChecklist(trip);
  }

  /* ----- itinerary ----- */

  function renderItinerary(trip){
    var content = document.getElementById('subtab-content');
    if(!trip.days.find(function(d){ return d.id === state.currentDayId; })){
      state.currentDayId = trip.days[0] ? trip.days[0].id : null;
    }
    var day = trip.days.find(function(d){ return d.id === state.currentDayId; });

    var tabsHtml = trip.days.map(function(d){
      return '<button class="day-tab' + (d.id === state.currentDayId ? ' active' : '') + '" data-day="' + d.id + '">' + escapeHtml(d.label) + '</button>';
    }).join('') + '<button class="day-tab add-day" id="add-day-btn">+ เพิ่มวัน</button>';

    var stopsHtml = day && day.stops.length ? day.stops.slice().sort(function(a,b){
      return (a.time||'99:99').localeCompare(b.time||'99:99');
    }).map(function(s){
      return '<div class="stop-card">' +
        '<div class="stop-time">' + escapeHtml(s.time || '--:--') + '</div>' +
        '<div class="stop-body"><div class="name">' + escapeHtml(s.name) + '</div>' +
          (s.note ? '<div class="note">' + escapeHtml(s.note) + '</div>' : '') +
        '</div>' +
        '<button class="icon-btn" data-del-stop="' + s.id + '" aria-label="ลบ">&times;</button>' +
      '</div>';
    }).join('') : '<p style="color:var(--ink-soft); font-size:14px;">ยังไม่มีจุดแวะสำหรับวันนี้</p>';

    content.innerHTML =
      '<div class="day-tabs">' + tabsHtml + '</div>' +
      '<div class="stop-list">' + stopsHtml + '</div>' +
      '<div class="inline-add-form">' +
        '<div class="row">' +
          '<input id="stop-time" type="time">' +
          '<input id="stop-name" type="text" placeholder="ชื่อสถานที่หรือกิจกรรม">' +
        '</div>' +
        '<input id="stop-note" type="text" placeholder="โน้ตเพิ่มเติม (ไม่บังคับ)">' +
        '<div class="field-error" id="stop-err"></div>' +
        '<button class="btn btn-primary" id="add-stop-btn" style="align-self:flex-start;">+ เพิ่มจุดแวะ</button>' +
      '</div>';

    content.querySelectorAll('[data-day]').forEach(function(btn){
      btn.addEventListener('click', function(){
        state.currentDayId = btn.getAttribute('data-day');
        renderItinerary(trip);
      });
    });
    document.getElementById('add-day-btn').addEventListener('click', function(){
      var newDay = { id: uid('day'), label: 'วันที่ ' + (trip.days.length + 1), stops: [] };
      trip.days.push(newDay);
      state.currentDayId = newDay.id;
      apiUpsertTrip(trip).then(function(){ renderItinerary(trip); });
    });
    content.querySelectorAll('[data-del-stop]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var did = btn.getAttribute('data-del-stop');
        day.stops = day.stops.filter(function(s){ return s.id !== did; });
        apiUpsertTrip(trip).then(function(){ renderItinerary(trip); });
      });
    });
    document.getElementById('add-stop-btn').addEventListener('click', function(){
      var nameEl = document.getElementById('stop-name');
      var name = nameEl.value.trim();
      var errEl = document.getElementById('stop-err');
      if(!name){
        errEl.textContent = 'กรุณาใส่ชื่อสถานที่หรือกิจกรรม';
        return;
      }
      errEl.textContent = '';
      day.stops.push({
        id: uid('stop'),
        time: document.getElementById('stop-time').value,
        name: name,
        note: document.getElementById('stop-note').value.trim()
      });
      apiUpsertTrip(trip).then(function(){ renderItinerary(trip); });
    });
  }

  /* ----- budget ----- */

  function renderBudget(trip){
    var content = document.getElementById('subtab-content');
    var total = trip.budget.reduce(function(sum, b){ return sum + (Number(b.amount) || 0); }, 0);

    var rowsHtml = trip.budget.length ? trip.budget.map(function(b){
      return '<div class="budget-row">' +
        '<span class="cat">' + escapeHtml(b.category || 'อื่นๆ') + '</span>' +
        '<span class="item">' + escapeHtml(b.item) + '</span>' +
        '<span class="amt">฿' + money(b.amount) + '</span>' +
        '<button class="icon-btn" data-del-budget="' + b.id + '" aria-label="ลบ">&times;</button>' +
      '</div>';
    }).join('') : '<p style="color:var(--ink-soft); font-size:14px; margin-top:12px;">ยังไม่มีรายการค่าใช้จ่าย</p>';

    content.innerHTML =
      '<div class="budget-summary">' +
        '<div class="sum-badge total"><div class="label">รวมทั้งหมด</div><div class="value">฿' + money(total) + '</div></div>' +
        '<div class="sum-badge"><div class="label">จำนวนรายการ</div><div class="value">' + trip.budget.length + '</div></div>' +
      '</div>' +
      '<div>' + rowsHtml + '</div>' +
      '<div class="inline-add-form" style="margin-top:18px;">' +
        '<div class="row">' +
          '<select id="b-cat" style="max-width:130px;">' +
            '<option value="ที่พัก">ที่พัก</option>' +
            '<option value="เดินทาง">เดินทาง</option>' +
            '<option value="อาหาร">อาหาร</option>' +
            '<option value="กิจกรรม">กิจกรรม</option>' +
            '<option value="อื่นๆ">อื่นๆ</option>' +
          '</select>' +
          '<input id="b-item" type="text" placeholder="รายการ เช่น ตั๋วเครื่องบิน">' +
        '</div>' +
        '<input id="b-amount" type="number" min="0" step="0.01" placeholder="จำนวนเงิน (บาท)">' +
        '<div class="field-error" id="b-err"></div>' +
        '<button class="btn btn-primary" id="add-budget-btn" style="align-self:flex-start;">+ เพิ่มรายการ</button>' +
      '</div>';

    content.querySelectorAll('[data-del-budget]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var bid = btn.getAttribute('data-del-budget');
        trip.budget = trip.budget.filter(function(b){ return b.id !== bid; });
        apiUpsertTrip(trip).then(function(){ renderBudget(trip); });
      });
    });
    document.getElementById('add-budget-btn').addEventListener('click', function(){
      var itemEl = document.getElementById('b-item');
      var amountEl = document.getElementById('b-amount');
      var errEl = document.getElementById('b-err');
      var item = itemEl.value.trim();
      var amount = amountEl.value;
      if(!item || !amount || isNaN(Number(amount)) || Number(amount) < 0){
        errEl.textContent = 'กรุณาใส่ชื่อรายการและจำนวนเงินให้ถูกต้อง';
        return;
      }
      errEl.textContent = '';
      trip.budget.push({
        id: uid('bud'),
        category: document.getElementById('b-cat').value,
        item: item,
        amount: Number(amount)
      });
      apiUpsertTrip(trip).then(function(){ renderBudget(trip); });
    });
  }

  /* ----- checklist ----- */

  function renderChecklist(trip){
    var content = document.getElementById('subtab-content');
    var doneCount = trip.checklist.filter(function(c){ return c.done; }).length;

    var rowsHtml = trip.checklist.length ? trip.checklist.map(function(c){
      return '<div class="checklist-row' + (c.done ? ' done' : '') + '">' +
        '<input type="checkbox" data-toggle="' + c.id + '" ' + (c.done ? 'checked' : '') + '>' +
        '<span class="text">' + escapeHtml(c.text) + '</span>' +
        '<button class="icon-btn" data-del-check="' + c.id + '" aria-label="ลบ">&times;</button>' +
      '</div>';
    }).join('') : '<p style="color:var(--ink-soft); font-size:14px; margin-top:12px;">ยังไม่มีของที่ต้องเตรียม</p>';

    content.innerHTML =
      (trip.checklist.length ? '<p class="eyebrow" style="margin-bottom:12px;">เตรียมแล้ว ' + doneCount + ' / ' + trip.checklist.length + '</p>' : '') +
      '<div>' + rowsHtml + '</div>' +
      '<div class="add-inline-row">' +
        '<input id="check-text" type="text" placeholder="เช่น จองที่พัก, เตรียมยา">' +
        '<button class="btn btn-primary" id="add-check-btn">+ เพิ่ม</button>' +
      '</div>' +
      '<div class="field-error" id="check-err"></div>';

    content.querySelectorAll('[data-toggle]').forEach(function(box){
      box.addEventListener('change', function(){
        var cid = box.getAttribute('data-toggle');
        var c = trip.checklist.find(function(x){ return x.id === cid; });
        if(c) c.done = box.checked;
        apiUpsertTrip(trip).then(function(){ renderChecklist(trip); });
      });
    });
    content.querySelectorAll('[data-del-check]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var cid = btn.getAttribute('data-del-check');
        trip.checklist = trip.checklist.filter(function(c){ return c.id !== cid; });
        apiUpsertTrip(trip).then(function(){ renderChecklist(trip); });
      });
    });
    document.getElementById('add-check-btn').addEventListener('click', function(){
      var textEl = document.getElementById('check-text');
      var text = textEl.value.trim();
      if(!text){
        document.getElementById('check-err').textContent = 'กรุณาใส่ข้อความก่อนเพิ่ม';
        return;
      }
      document.getElementById('check-err').textContent = '';
      trip.checklist.push({ id: uid('chk'), text: text, done: false });
      textEl.value = '';
      apiUpsertTrip(trip).then(function(){ renderChecklist(trip); });
    });
  }

})();
</script>
</body>
</html>
